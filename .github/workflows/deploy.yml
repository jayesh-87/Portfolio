name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a manual re-deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

# Minimal permissions; the job uses OIDC to upload the artifact to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Installs exactly what package-lock.json pins.
      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build production site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
